name: "字幕导出问题"
description: "ASS 生成、样式、分行或历史结果导出异常"
title: "[字幕导出] "
labels:
  - "bug"
body:
  - type: "markdown"
    attributes:
      value: "请先搜索已有 Issue，确认是否已有相同问题。上传素材、截图或日志前，请移除账号、令牌等个人信息。"
  - type: "input"
    id: "version"
    attributes:
      label: "SekaiTools 版本"
      description: "可从“设置与关于”查看；请注明完整版本号。"
    validations:
      required: true
  - type: "input"
    id: "environment"
    attributes:
      label: "系统环境"
      description: "请填写 Windows 版本；涉及性能、识别或压制时，也请填写 CPU、显卡与内存。"
    validations:
      required: true
  - type: "textarea"
    id: "description"
    attributes:
      label: "问题描述与预期行为"
      description: "实际发生了什么？你期望得到什么结果？"
    validations:
      required: true
  - type: "textarea"
    id: "steps"
    attributes:
      label: "复现步骤"
      description: "请按顺序描述从打开页面到出现问题的操作，并说明是否每次都能复现。"
    validations:
      required: true
  - type: "textarea"
    id: "input"
    attributes:
      label: "导出素材与设置"
      description: "请提供剧本、翻译文件、导出选项和样式设置；如与识别结果有关，请同时提供视频来源或片段。"
    validations:
      required: true
  - type: "textarea"
    id: "output"
    attributes:
      label: "导出结果"
      description: "请上传输出 ASS 文件，并附异常时间点、台词和播放截图；如仅在特定播放器出现，请填写播放器名称与版本。"
  - type: "textarea"
    id: "others"
    attributes:
      label: "补充信息"
      description: "可补充日志、已尝试的解决方法，或是否在旧版本正常。"
